version: "2"
sql:
  - engine: "mysql"
    schema: "migrations/*.up.sql"
    queries: "internal/db/query"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
